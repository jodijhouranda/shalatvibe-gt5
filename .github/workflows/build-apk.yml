name: Build and Release Jadwal APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/jadwal-release.jks
            echo "KEYSTORE_FILE=/tmp/jadwal-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON"
          else
            echo "No Firebase secret configured; building without google-services.json"
          fi

      - name: Run unit tests and build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Inspect APK Signing Certificate (SHA-1 & SHA-256)
        id: cert
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -1 "$SDK_DIR"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          SHA1=""
          SHA256=""
          OWNER=""

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            CERT_OUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" || true)"
            RAW_SHA1="$(printf '%s\n' "$CERT_OUT" | grep -m1 'SHA-1 digest:' | sed 's/.*SHA-1 digest:[[:space:]]*//')"
            RAW_SHA256="$(printf '%s\n' "$CERT_OUT" | grep -m1 'SHA-256 digest:' | sed 's/.*SHA-256 digest:[[:space:]]*//')"
            OWNER="$(printf '%s\n' "$CERT_OUT" | grep -m1 'certificate DN:' | sed 's/.*certificate DN:[[:space:]]*//')"
            if [ -n "$RAW_SHA1" ]; then
              SHA1="$(printf '%s' "$RAW_SHA1" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
            fi
            if [ -n "$RAW_SHA256" ]; then
              SHA256="$(printf '%s' "$RAW_SHA256" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
            fi
          fi

          if [ -z "$SHA1" ]; then
            CERT_OUT="$(keytool -printcert -jarfile "$APK_PATH" 2>/dev/null || true)"
            SHA1="$(printf '%s\n' "$CERT_OUT" | grep -m1 'SHA1:' | sed 's/.*SHA1:[[:space:]]*//')"
            SHA256="$(printf '%s\n' "$CERT_OUT" | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//')"
            OWNER="${OWNER:-$(printf '%s\n' "$CERT_OUT" | grep -m1 'Owner:' | sed 's/.*Owner:[[:space:]]*//')}"
          fi

          echo "=== APK Signing Certificate ==="
          echo "Owner  : ${OWNER:-unknown}"
          echo "SHA-1  : ${SHA1:-unavailable}"
          echo "SHA-256: ${SHA256:-unavailable}"
          {
            echo "sha1=${SHA1:-unavailable}"
            echo "sha256=${SHA256:-unavailable}"
            echo "owner=${OWNER:-unknown}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Sidik Jari Sertifikat APK Rilis"
            printf -- '- **Owner:** `%s`\n' "${OWNER:-unknown}"
            printf -- '- **SHA-1 (Google Sign-In):** `%s`\n' "${SHA1:-unavailable}"
            printf -- '- **SHA-256 (Firebase App Check):** `%s`\n' "${SHA256:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Determine Release Tag and Rename APK
        id: meta
        run: |
          APP_VER="$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$APP_VER" ]; then
            TAG="v${APP_VER}"
          else
            TAG="latest"
          fi
          APK_FILE="Nida-${TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          ls -lh "$APK_FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nida-release-apk
          path: Nida-*-release.apk
          retention-days: 30

      - name: Publish GitHub Release automatically on push to main or version tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK_FILE: ${{ steps.meta.outputs.apk_file }}
          APK_SHA1: ${{ steps.cert.outputs.sha1 }}
          APK_SHA256: ${{ steps.cert.outputs.sha256 }}
        run: |
          {
            printf 'Rilis resmi **Nida %s** (Release APK teroptimasi R8 + *signed keystore*):\n' "$TAG"
            cat <<'NOTES'
          - **Pustaka Tafsir (22 Kitab Arab Asli)**: Mode baca 1 kitab fokus, pemilih kitab berkategori, pencarian surah & *autocomplete* potongan ayat Al-Qur'an, kartu ayat bisa dilipat, mode Harakat/Gundul, 3 tema kertas, bookmark & cache lokal
          - **Kamus AI & Kamus Saya**: Ketuk kata atau pilih rentang `+ Frase` langsung dari teks Tafsir & pelajaran Arab — konteks otomatis diringkas ke 1 kalimat di sekitar kata yang diketuk agar cepat & hemat token, tersinkron cloud dengan Google Sign-In
          - **Belajar Arab Interaktif, Fiqh Muamalah, Jadwal Shalat & GT 5**: Fitur inti lengkap dengan *Home Screen Widget* & kompas Kiblat

          ### Sidik Jari Sertifikat APK (untuk Firebase Console)
          NOTES
            printf -- '- **SHA-1 (Google Sign-In):** `%s`\n' "$APK_SHA1"
            printf -- '- **SHA-256 (Firebase App Check):** `%s`\n' "$APK_SHA256"
          } > /tmp/release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release edit "$TAG" --title "Nida ${TAG}" --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG" "$APK_FILE" --title "Nida ${TAG}" --notes-file /tmp/release_notes.md
          fi
