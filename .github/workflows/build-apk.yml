name: Build and Release Jadwal APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/jadwal-release.jks
            echo "KEYSTORE_FILE=/tmp/jadwal-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Rename Release APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          cp app/build/outputs/apk/release/app-release.apk "Jadwal-${TAG_NAME}-release.apk"
          ls -lh "Jadwal-${TAG_NAME}-release.apk"

      - name: Upload Jadwal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-release-apk
          path: Jadwal-*-release.apk
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_FILE="Jadwal-${TAG}-release.apk"
          cat > /tmp/release_notes.md <<'NOTES'
          Rilis resmi **Jadwal** (Release APK teroptimasi R8 + *signed keystore* permanen):
          - **Belajar Arab Interaktif (`Teks` ↔ `PDF Asli` + Ruang Baca Lega)**: *Toggle* PDF langsung di *Top Bar*, *toolbar* ringkas ikut tergulung + tombol melayang, tipografi rapat nyaman, serta proteksi *navigation bar* & *Back* — ketuk kata mana saja atau pakai **`+ Frase`** & **تَشْكِيل ↔ Gundul** untuk menyimpan ke **Kamus Saya**
          - **Kamus Saya + Spaced Repetition (SRS)**: Kartu review terjadwal (+1, +3, +7, +14 hari), *Flashcard* bolak-balik, *Kuis Kalimat Konteks*, pelafalan suara Arab *offline* (`TextToSpeech`), tombol **`▶ Klip`** lompat ke detik video aslinya, & ekspor/impor **CSV siap Anki / JSON**
          - **Kursus Fiqh Muamalah Terkalibrasi**: Seluruh 5 seri kajian Syaikh Abdussalam asy-Syuwai'ir tersinkron kata demi kata dengan kitab *Tafrigh Daurah Tabuk* & *auto-highlight* / *auto-scroll*
          - **Desain Tonal Modern & Fitur Inti**: *Atmosphere Hero Card*, *Solar Arc*, kompas Kiblat GT 5, kalender Hijriah offline, 52 kota Indonesia, override getar per shalat, & *Home Screen Widget*
          - Ikon **Jadwal** (huruf **ج** + sabit & titik matahari emas)
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" --title "Jadwal ${TAG}" --notes-file /tmp/release_notes.md
          fi
