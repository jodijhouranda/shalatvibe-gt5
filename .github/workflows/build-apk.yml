name: Build ShalatVibe GT5 APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build Debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload ShalatVibe GT5 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShalatVibeGT5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
